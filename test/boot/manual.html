<!doctype html>
<title>Mounted by hand</title>
<p>data-manual holds the automatic mount back, so the snippet is the only thing
that puts a trackpad on the page — and the tag's other settings still apply.</p>
<script src="/dist/hand-cursor.min.js" data-manual data-margin="40"></script>
<script>
  HandCursor.init({ minimized: true });
</script>
