<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hand Tracking Cursor — test harness</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #page { height: 3000px; padding: 40px; }
      #btn { padding: 20px 30px; font-size: 20px; }
      #box { margin-top: 40px; width: 400px; height: 200px; overflow-y: auto; border: 2px solid #333; }
      #box div { padding: 20px; }
      /* ?smooth=1 adds the CSS that makes every programmatic scroll an
         animation — the thing that makes a page lurch under a synthetic
         cursor. Applied from script below so it can be toggled per run. */
      /* No transition, so the mirrored rule can be read back synchronously. */
      #hoverme { margin-top: 20px; width: 300px; padding: 20px; background: rgb(10, 20, 30); }
      #hoverme:hover { background: rgb(0, 202, 72); }
    </style>
  </head>
  <body>
    <div id="page">
      <button id="btn">click me</button>
      <span id="out">0</span>
      <div id="box"></div>
      <div id="hoverme">hover target</div>
    </div>

    <script src="../dist/hand-cursor.js" data-manual></script>
    <script>
      /*
       * Drives the controller with synthetic landmarks so the cursor, gesture
       * and scrolling behaviour can be tested without a camera or the MediaPipe
       * model. `feed()` stands in for one frame of tracking.
       */
      document.getElementById('box').innerHTML = Array.from(
        { length: 40 },
        (_, i) => `<div>row ${i}</div>`,
      ).join('');

      let clicks = 0;
      document.getElementById('btn').addEventListener('click', () => {
        document.getElementById('out').textContent = String(++clicks);
      });

      // Smoothing is turned almost off so a fed position lands immediately.
      const mode = new URLSearchParams(location.search).get('mode') || 'write';
      window.hc = HandCursor.init({
        font: false,
        smoothing: { minCutoff: 60, beta: 0 },
        drag: { mode },
      });

      if (new URLSearchParams(location.search).get('smooth') === '1') {
        document.documentElement.style.scrollBehavior = 'smooth';
      }

      // ?lenis=1 loads Lenis over the top. Smooth-scroll libraries are the
      // obvious suspect for scroll jank, so the suite checks we coexist.
      window.lenisReady = (async () => {
        if (new URLSearchParams(location.search).get('lenis') !== '1') return false;
        const { default: Lenis } = await import('/node_modules/lenis/dist/lenis.mjs');
        const lenis = new Lenis({ autoRaf: false });
        window.lenis = lenis;
        const raf = (t) => { lenis.raf(t); requestAnimationFrame(raf); };
        requestAnimationFrame(raf);
        return true;
      })();

      const OPEN = [
        [0.50, 0.95], [0.67, 0.87], [0.79, 0.75], [0.86, 0.64], [0.91, 0.54],
        [0.58, 0.53], [0.61, 0.37], [0.62, 0.27], [0.63, 0.17],
        [0.47, 0.51], [0.47, 0.33], [0.47, 0.22], [0.47, 0.12],
        [0.36, 0.53], [0.33, 0.36], [0.32, 0.25], [0.31, 0.16],
        [0.26, 0.58], [0.21, 0.45], [0.19, 0.36], [0.17, 0.28],
      ];
      const VIDEO = { videoWidth: 640, videoHeight: 480 };

      /** An open or pinched hand whose control point sits at (cx, cy). */
      window.makeHand = (cx, cy, pinch) => {
        const points = OPEN.map(([x, y]) => ({ x, y, z: 0 }));
        if (pinch) {
          const mx = (points[4].x + points[8].x) / 2;
          const my = (points[4].y + points[8].y) / 2;
          points[4] = { x: mx + 0.005, y: my, z: 0 };
          points[8] = { x: mx - 0.005, y: my, z: 0 };
        }
        const dx = cx - (points[4].x + points[8].x) / 2;
        const dy = cy - (points[4].y + points[8].y) / 2;
        return points.map((p) => ({ x: p.x + dx, y: p.y + dy, z: 0 }));
      };

      let clock = 1000;
      window.feed = (cx, cy, pinch, step = 16) => {
        clock += step;
        hc.consumeHand(window.makeHand(cx, cy, pinch), clock, VIDEO);
        return { x: hc.position.x, y: hc.position.y, pinching: hc.pinching };
      };

      /**
       * Drives a pinch-drag at `trackingFps` — the rate landmarks really arrive
       * — while sampling the scroll position every repaint. Jank lives in the
       * gap between those two rates, so this is what measures it.
       */
      window.timedDrag = async ({ trackingFps = 20, seconds = 1.2 } = {}) => {
        window.scrollTo(0, 0);
        window.lenis?.scrollTo(0, { immediate: true });
        await new Promise((r) => setTimeout(r, 200));

        const samples = [];
        let sampling = true;
        const sample = () => {
          if (!sampling) return;
          samples.push(window.scrollY);
          requestAnimationFrame(sample);
        };
        requestAnimationFrame(sample);

        const stepMs = 1000 / trackingFps;
        const steps = Math.round(seconds * trackingFps);
        const cx = innerWidth - 60;           // clear of the trackpad card
        const bottom = innerHeight * 0.85;
        const top = innerHeight * 0.15;
        let cy = bottom;

        for (let i = 0; i < 30; i++) window.feed(...window.toCamera(cx, cy), false, stepMs);
        window.feed(...window.toCamera(cx, cy), true, stepMs);
        for (let i = 0; i < steps; i++) {
          cy -= (bottom - top) / steps;
          window.feed(...window.toCamera(cx, cy), true, stepMs);
          await new Promise((r) => setTimeout(r, stepMs));
        }
        window.feed(...window.toCamera(cx, cy), false, stepMs);
        await new Promise((r) => setTimeout(r, 300));
        sampling = false;

        const deltas = [];
        for (let i = 1; i < samples.length; i++) deltas.push(samples[i] - samples[i - 1]);
        // Only judge frames from the moment the page actually starts moving.
        const first = deltas.findIndex((d) => Math.abs(d) > 0.5);
        const active = first === -1 ? [] : deltas.slice(first);
        return {
          frames: active.length,
          stalled: active.filter((d) => Math.abs(d) <= 0.5).length,
          biggestJump: Math.max(0, ...active.map(Math.abs)),
          scrolled: samples.at(-1) - samples[0],
        };
      };

      /**
       * Measures the two things a scroll has to get right, separately:
       * how quickly the page starts moving once the hand does, and how far it
       * coasts after release.
       *
       * The hand is released while still travelling at `speed`, which is what a
       * flick actually is. Running it into the top of the viewport instead would
       * park the cursor against the edge for the last few frames and hand the
       * fling a velocity near zero — measuring the clamp, not the throw.
       */
      window.feelTest = async ({ speed = 1400, holdFrames = 0 } = {}) => {
        window.scrollTo(0, 0);
        await new Promise((r) => setTimeout(r, 250));

        const cx = innerWidth - 60;
        const bottom = innerHeight * 0.9;
        const top = innerHeight * 0.1;
        let cy = bottom;
        const stepMs = 1000 / 30;
        const perStep = (speed * stepMs) / 1000;
        const steps = Math.floor((bottom - top) / perStep);

        for (let i = 0; i < 30; i++) window.feed(...window.toCamera(cx, cy), false, stepMs);
        window.feed(...window.toCamera(cx, cy), true, stepMs);

        // Drag until the page has clearly started, timing how long that takes.
        const startedAt = performance.now();
        let latency = null;
        for (let i = 0; i < steps; i++) {
          cy -= perStep;
          window.feed(...window.toCamera(cx, cy), true, stepMs);
          await new Promise((r) => setTimeout(r, stepMs));
          if (latency === null && window.scrollY > 20) latency = performance.now() - startedAt;
        }

        // `holdFrames` parks the hand still before letting go — the gesture
        // that has to stop the page dead rather than throw it.
        for (let i = 0; i < holdFrames; i++) {
          window.feed(...window.toCamera(cx, cy), true, stepMs);
          await new Promise((r) => setTimeout(r, stepMs));
        }

        const atRelease = window.scrollY;
        window.feed(...window.toCamera(cx, cy), false, stepMs);
        await new Promise((r) => setTimeout(r, 1800));
        return {
          steps,
          latencyMs: latency === null ? -1 : Math.round(latency),
          duringDrag: Math.round(atRelease),
          coasted: Math.round(window.scrollY - atRelease),
        };
      };

      /** Viewport point -> camera coordinates, undoing mirror and dead zone. */
      window.toCamera = (x, y) => {
        const r = hc.options.region;
        return [
          1 - ((x / innerWidth) * (1 - 2 * r.x) + r.x),
          (y / innerHeight) * (1 - 2 * r.y) + r.y,
        ];
      };
    </script>
  </body>
</html>
