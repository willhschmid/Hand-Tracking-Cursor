<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hand Tracking Cursor — test harness</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #page { height: 3000px; padding: 40px; }
      #btn { padding: 20px 30px; font-size: 20px; }
      #box { margin-top: 40px; width: 400px; height: 200px; overflow-y: auto; border: 2px solid #333; }
      #box div { padding: 20px; }
      /* ?smooth=1 adds the CSS that makes every programmatic scroll an
         animation — the thing that makes a page lurch under a synthetic
         cursor. Applied from script below so it can be toggled per run. */
      /* No transition, so the mirrored rule can be read back synchronously. */
      #hoverme { margin-top: 20px; width: 300px; padding: 20px; background: rgb(10, 20, 30); }
      #hoverme:hover { background: rgb(0, 202, 72); }

      /* Three ways a page says "this can be dragged", one of each. */
      #card { margin-top: 20px; width: 200px; height: 80px; background: #ddd; }
      #dropzone { margin-top: 12px; width: 200px; height: 80px; background: #eee; }
      /* A library-style handle: no attribute, no selector, just the CSS that
         every drag library leaves behind. */
      #handle {
        margin-top: 12px; width: 200px; height: 80px; background: rgb(10, 20, 30);
        cursor: grab; touch-action: none; position: relative;
      }
      /* Drag handles almost always have a hover state — a lift, a shadow, a
         colour. It has to survive the whole drag, the way it does under a
         mouse, or the element flashes partway through the gesture. */
      #handle:hover { background: rgb(0, 202, 72); }
      #plain { margin-top: 12px; width: 200px; height: 80px; background: #fdd; }
    </style>
  </head>
  <body>
    <div id="page">
      <button id="btn">click me</button>
      <span id="out">0</span>
      <div id="box"></div>
      <div id="hoverme">hover target</div>
      <div id="card" draggable="true">html5 draggable</div>
      <div id="dropzone">drop zone</div>
      <div id="handle">library handle</div>
      <div id="plain">not draggable</div>
    </div>

    <script src="../dist/hand-cursor.js" data-manual></script>
    <script>
      /*
       * Drives the controller with synthetic landmarks so the cursor, gesture
       * and scrolling behaviour can be tested without a camera or the MediaPipe
       * model. `feed()` stands in for one frame of tracking.
       */
      document.getElementById('box').innerHTML = Array.from(
        { length: 40 },
        (_, i) => `<div>row ${i}</div>`,
      ).join('');

      /*
       * The HTML5 drop zone: a target only accepts a drop by cancelling
       * `dragover`, so this is what a real one has to do.
       */
      window.dragLog = [];
      for (const type of ['dragstart', 'drag', 'dragend']) {
        document.getElementById('card').addEventListener(type, (e) => {
          window.dragLog.push(type);
        });
      }
      for (const type of ['dragenter', 'dragover', 'dragleave', 'drop']) {
        document.getElementById('dropzone').addEventListener(type, (e) => {
          e.preventDefault();
          window.dragLog.push(type);
        });
      }

      /*
       * The pointer-event kind, which is how every modern drag library works:
       * listeners on the document, translating by the delta since pointerdown.
       */
      window.grabLog = [];
      {
        const handle = document.getElementById('handle');
        let from = null;
        handle.addEventListener('pointerdown', (e) => {
          window.grabLog.push('pointerdown');
          from = { x: e.clientX, y: e.clientY };
        });
        handle.addEventListener('click', () => window.grabLog.push('click'));
        document.addEventListener('pointerup', () => window.grabLog.push('pointerup'));
        document.addEventListener('pointermove', (e) => {
          if (!from) return;
          handle.style.transform =
            `translate(${e.clientX - from.x}px, ${e.clientY - from.y}px)`;
        });
        document.addEventListener('pointerup', () => {
          from = null;
        });
      }

      let clicks = 0;
      document.getElementById('btn').addEventListener('click', () => {
        document.getElementById('out').textContent = String(++clicks);
      });

      // Smoothing is turned almost off so a fed position lands immediately.
      const mode = new URLSearchParams(location.search).get('mode') || 'write';
      window.hc = HandCursor.init({
        font: false,
        smoothing: { minCutoff: 60, beta: 0 },
        drag: { mode },
      });

      if (new URLSearchParams(location.search).get('smooth') === '1') {
        document.documentElement.style.scrollBehavior = 'smooth';
      }

      // ?lenis=1 loads Lenis over the top. Smooth-scroll libraries are the
      // obvious suspect for scroll jank, so the suite checks we coexist.
      window.lenisReady = (async () => {
        if (new URLSearchParams(location.search).get('lenis') !== '1') return false;
        const { default: Lenis } = await import('/node_modules/lenis/dist/lenis.mjs');
        const lenis = new Lenis({ autoRaf: false });
        window.lenis = lenis;
        const raf = (t) => { lenis.raf(t); requestAnimationFrame(raf); };
        requestAnimationFrame(raf);
        return true;
      })();

      const OPEN = [
        [0.50, 0.95], [0.67, 0.87], [0.79, 0.75], [0.86, 0.64], [0.91, 0.54],
        [0.58, 0.53], [0.61, 0.37], [0.62, 0.27], [0.63, 0.17],
        [0.47, 0.51], [0.47, 0.33], [0.47, 0.22], [0.47, 0.12],
        [0.36, 0.53], [0.33, 0.36], [0.32, 0.25], [0.31, 0.16],
        [0.26, 0.58], [0.21, 0.45], [0.19, 0.36], [0.17, 0.28],
      ];
      const VIDEO = { videoWidth: 640, videoHeight: 480 };

      /** An open or pinched hand whose control point sits at (cx, cy). */
      window.makeHand = (cx, cy, pinch) => {
        const points = OPEN.map(([x, y]) => ({ x, y, z: 0 }));
        if (pinch) {
          const mx = (points[4].x + points[8].x) / 2;
          const my = (points[4].y + points[8].y) / 2;
          points[4] = { x: mx + 0.005, y: my, z: 0 };
          points[8] = { x: mx - 0.005, y: my, z: 0 };
        }
        const dx = cx - (points[4].x + points[8].x) / 2;
        const dy = cy - (points[4].y + points[8].y) / 2;
        return points.map((p) => ({ x: p.x + dx, y: p.y + dy, z: 0 }));
      };

      let clock = performance.now();
      window.feed = (cx, cy, pinch, step = 16) => {
        clock += step;
        hc.consumeHand(window.makeHand(cx, cy, pinch), clock, VIDEO);
        return { x: hc.position.x, y: hc.position.y, pinching: hc.pinching };
      };

      /**
       * A landmark stamped with real time, which is what the controller really
       * does — the timestamp is the animation frame the hand was seen in.
       *
       * Anything measuring scroll timing has to use this rather than the
       * synthetic step above. The scroll runner reads the hand's path against
       * this clock and renders it against requestAnimationFrame, so a test that
       * advances a made-up clock faster than the wall is not describing
       * anything that can happen.
       */
      window.feedNow = (cx, cy, pinch) => {
        // Pinned to the wall, not merely nudged towards it: earlier tests drive
        // the synthetic clock forward far faster than real time, and a path
        // timestamped seconds into the future never comes into view at all.
        clock = performance.now();
        hc.consumeHand(window.makeHand(cx, cy, pinch), clock, VIDEO);
        return { x: hc.position.x, y: hc.position.y, pinching: hc.pinching };
      };

      /**
       * Scrolls an element to the middle of the viewport and says where it
       * landed.
       *
       * Waits for the page to stop moving first. A throw from a previous
       * gesture coasts for about a second and a half, and it will happily carry
       * on scrolling after `scrollIntoView` has run — leaving coordinates that
       * pointed at the right thing when they were measured and somewhere else
       * by the time they are used.
       */
      window.spot = async (id) => {
        let last = NaN;
        while (last !== window.scrollY) {
          last = window.scrollY;
          await new Promise((r) => setTimeout(r, 80));
        }
        const el = document.getElementById(id);
        el.scrollIntoView({ block: 'center', behavior: 'instant' });
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      };

      /**
       * A plain pinch-drag, awaited, in real time.
       *
       * Real time is not optional here. The scroll runner reads the hand's path
       * against the same clock it renders against, so a drag crammed into a
       * couple of milliseconds of made-up time is not a drag it can serve — nor
       * one any device could produce.
       */
      window.pinchDrag = async ({ x, y, dx = 0, dy = 0, steps = 12, fps = 30, release = true, holdMs = 0 } = {}) => {
        let cx = x;
        let cy = y;
        for (let i = 0; i < 30; i++) window.feedNow(...window.toCamera(cx, cy), false);
        window.feedNow(...window.toCamera(cx, cy), true);
        // Pinched but still, which is what a long press is.
        const until = performance.now() + holdMs;
        while (performance.now() < until) {
          await new Promise((r) => setTimeout(r, 1000 / fps));
          window.feedNow(...window.toCamera(cx, cy), true);
        }
        for (let i = 0; i < steps; i++) {
          await new Promise((r) => setTimeout(r, 1000 / fps));
          cx += dx / steps;
          cy += dy / steps;
          window.feedNow(...window.toCamera(cx, cy), true);
        }
        if (release) window.feedNow(...window.toCamera(cx, cy), false);
        return { x: cx, y: cy };
      };

      /**
       * Drives a pinch-drag at `trackingFps` — the rate landmarks really arrive
       * — while sampling the scroll position every repaint. Jank lives in the
       * gap between those two rates, so this is what measures it.
       */
      window.timedDrag = async ({ trackingFps = 20, seconds = 1.2, jitter = 0 } = {}) => {
        window.scrollTo(0, 0);
        window.lenis?.scrollTo(0, { immediate: true });
        await new Promise((r) => setTimeout(r, 200));

        // Timestamped, because what matters is the speed the page moved at, not
        // the distance it covered per callback. If the browser drops a repaint
        // the next one legitimately covers twice the ground at the same speed,
        // and counting that as a jump measures the machine's load rather than
        // the scroll.
        const samples = [];
        let sampling = true;
        const sample = (t) => {
          if (!sampling) return;
          // Read from a task rather than inside the animation frame itself.
          // The scroll runner writes from its own rAF callback, and two
          // callbacks in the same frame run in registration order — which can
          // swap. Sampling inside the frame then catches the position before
          // the write on one frame and after it on the next, and reports a
          // stall followed by a double step that never happened. A task runs
          // once every callback for that frame is done, so it always sees the
          // frame's finished position.
          setTimeout(() => {
            if (sampling) samples.push({ y: window.scrollY, t });
          }, 0);
          requestAnimationFrame(sample);
        };
        requestAnimationFrame(sample);

        const stepMs = 1000 / trackingFps;
        const steps = Math.round(seconds * trackingFps);
        const cx = innerWidth - 60;           // clear of the trackpad card
        const bottom = innerHeight * 0.85;
        const top = innerHeight * 0.15;
        let cy = bottom;

        for (let i = 0; i < 30; i++) window.feedNow(...window.toCamera(cx, cy), false);
        window.feedNow(...window.toCamera(cx, cy), true);
        // `jitter` spreads the landmark arrivals out unevenly, which is what a
        // phone really does — inference time varies frame to frame. Even
        // spacing flatters any scheme that assumes a steady rate.
        let seed = 12345;
        const wobble = () => {
          seed = (seed * 1103515245 + 12345) & 0x7fffffff;
          return 1 + ((seed / 0x7fffffff) * 2 - 1) * jitter;
        };
        // The hand travels at a genuinely constant speed, measured against the
        // wall rather than against the requested delay — `setTimeout` is not
        // accurate enough to stand in for one, and a hand that only moves at a
        // constant speed on paper cannot tell us whether the page does.
        const speed = (bottom - top) / seconds;
        let previous = performance.now();
        for (let i = 0; i < steps; i++) {
          await new Promise((r) => setTimeout(r, stepMs * wobble()));
          const at = performance.now();
          cy -= speed * ((at - previous) / 1000);
          previous = at;
          window.feedNow(...window.toCamera(cx, cy), true);
        }
        window.feedNow(...window.toCamera(cx, cy), false);
        const releasedAt = samples.length;
        await new Promise((r) => setTimeout(r, 300));
        sampling = false;

        // Speed per repaint, normalized to one 60Hz frame so the numbers still
        // read as pixels-per-step.
        const deltas = [];
        for (let i = 1; i < samples.length; i++) {
          const dt = Math.max(samples[i].t - samples[i - 1].t, 1);
          deltas.push(((samples[i].y - samples[i - 1].y) / dt) * (1000 / 60));
        }
        // Only judge frames from the moment the page actually starts moving.
        const first = deltas.findIndex((d) => Math.abs(d) > 0.5);
        const active = first === -1 ? [] : deltas.slice(first);
        // Roughness during the drag itself, which is where jumpiness is felt.
        // A hand moving at a steady speed should produce a steady stream of
        // equal steps, so what matters is not how big a step is but how much it
        // differs from the one before it. 0 is a perfectly even glide; 1 means
        // consecutive repaints differ by as much as a whole step.
        const held = first === -1 ? [] : deltas.slice(first, Math.max(releasedAt - 2, first));
        const mean = held.reduce((a, b) => a + Math.abs(b), 0) / Math.max(held.length, 1);
        let churn = 0;
        for (let i = 1; i < held.length; i++) churn += Math.abs(held[i] - held[i - 1]);
        return {
          frames: active.length,
          stalled: active.filter((d) => Math.abs(d) <= 0.5).length,
          biggestJump: Math.max(0, ...active.map(Math.abs)),
          scrolled: samples.at(-1).y - samples[0].y,
          step: Number(mean.toFixed(2)),
          roughness: Number((churn / Math.max(held.length - 1, 1) / (mean || 1)).toFixed(3)),
        };
      };

      /**
       * Measures the two things a scroll has to get right, separately:
       * how quickly the page starts moving once the hand does, and how far it
       * coasts after release.
       *
       * The hand is released while still travelling at `speed`, which is what a
       * flick actually is. Running it into the top of the viewport instead would
       * park the cursor against the edge for the last few frames and hand the
       * fling a velocity near zero — measuring the clamp, not the throw.
       */
      window.feelTest = async ({ speed = 1400, holdFrames = 0 } = {}) => {
        window.scrollTo(0, 0);
        await new Promise((r) => setTimeout(r, 250));

        const cx = innerWidth - 60;
        const bottom = innerHeight * 0.9;
        const top = innerHeight * 0.1;
        let cy = bottom;
        const stepMs = 1000 / 30;
        const perStep = (speed * stepMs) / 1000;
        const steps = Math.floor((bottom - top) / perStep);

        for (let i = 0; i < 30; i++) window.feedNow(...window.toCamera(cx, cy), false);
        window.feedNow(...window.toCamera(cx, cy), true);

        // Drag until the page has clearly started, timing how long that takes.
        const startedAt = performance.now();
        let latency = null;
        for (let i = 0; i < steps; i++) {
          cy -= perStep;
          window.feedNow(...window.toCamera(cx, cy), true);
          await new Promise((r) => setTimeout(r, stepMs));
          if (latency === null && window.scrollY > 20) latency = performance.now() - startedAt;
        }

        // `holdFrames` parks the hand still before letting go — the gesture
        // that has to stop the page dead rather than throw it.
        for (let i = 0; i < holdFrames; i++) {
          window.feedNow(...window.toCamera(cx, cy), true);
          await new Promise((r) => setTimeout(r, stepMs));
        }

        const atRelease = window.scrollY;
        window.feedNow(...window.toCamera(cx, cy), false);
        await new Promise((r) => setTimeout(r, 1800));
        return {
          steps,
          latencyMs: latency === null ? -1 : Math.round(latency),
          duringDrag: Math.round(atRelease),
          coasted: Math.round(window.scrollY - atRelease),
        };
      };

      /** Viewport point -> camera coordinates, undoing mirror and dead zone. */
      window.toCamera = (x, y) => {
        const r = hc.options.region;
        return [
          1 - ((x / innerWidth) * (1 - 2 * r.x) + r.x),
          (y / innerHeight) * (1 - 2 * r.y) + r.y,
        ];
      };
    </script>
  </body>
</html>
